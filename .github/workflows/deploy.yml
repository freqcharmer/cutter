name: Deploy to EMFDPRODCO.com/cutter

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Skip if FTP secrets are not set yet
        if: env.FTP_SERVER == ''
        run: echo "FTP secrets not set; skipping deploy."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Upload over FTPS
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            tests/**
